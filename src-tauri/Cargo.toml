[package]
name = "unhidden"
version = "1.0.0"
description = "Switch to every Steam account on your PC, including the ones Steam hides."
edition = "2021"
license = "MIT"
repository = "https://github.com/Kh8da/unhidden"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
steamcore = { path = "../steamcore" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
