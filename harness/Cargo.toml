[package]
name = "harness"
version = "1.0.0"
edition = "2021"
publish = false
description = "End-to-end test of unhidden's switching code against a fake Steam."

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "fake-steam"
path = "src/bin/fake-steam.rs"

[dependencies]
steamcore = { path = "../steamcore" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
