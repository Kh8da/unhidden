name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            build: npx tauri build --no-bundle
          - name: linux
            # The oldest supported Ubuntu, so the AppImage runs on older distros too.
            os: ubuntu-22.04
            build: npx tauri build
          - name: macos
            os: macos-latest
            build: npx tauri build --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Core tests
        run: cargo test -p steamcore

      - name: End-to-end test against a fake Steam
        shell: bash
        run: |
          cargo build --release -p harness
          ./target/release/harness --ci

      - name: Build app
        run: ${{ matrix.build }}

      # Fixed names, so README links to releases/latest/download/... always work.
      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          case "${{ matrix.name }}" in
            windows) cp target/release/Unhidden.exe dist/Unhidden-windows-x64.exe ;;
            linux)
              cp target/release/bundle/appimage/*.AppImage dist/Unhidden-linux-x86_64.AppImage
              cp target/release/bundle/deb/*.deb dist/Unhidden-linux-amd64.deb ;;
            macos) cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/Unhidden-macos.dmg ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: unhidden-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # A version in src-tauri/tauri.conf.json that has no release yet gets one,
  # tagged v<version>, as soon as it reaches main and every platform passed.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: New version?
        id: version
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: unhidden ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          files: dist/*
